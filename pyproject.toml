[project]
name = "my-idm"
version = "1.0.0"
description = "A full-featured download manager with GUI — supports HTTP segmented downloads, torrents, pause/resume, and more."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.10.0",
    "aiosqlite>=0.20",
    "humanize>=4.9",
    "libtorrent>=2.0",
    "psutil>=5.9",
    # Tier 2 of `utils.send_to_trash`, after Qt's `QFile.moveToTrash`. Qt declines whenever the
    # platform has no trash to move to - a headless session, a desktop without a trash spec dir,
    # a Windows volume with the Recycle Bin disabled - and the fallback is what keeps a deleted
    # download recoverable. Pure Python, so it costs nothing on any of the three platforms, and
    # the suite patches `send2trash.send2trash` directly, so it has to be a real dependency
    # rather than an optional one.
    "send2trash>=1.8.3",
    # Windows-only balloon notifications. The marker is load-bearing: pip cannot resolve this
    # package on Linux or macOS, so an unmarked entry makes `pip install` fail outright rather
    # than skip it. `notifications.py` already guards the import, so the code degrades to the
    # tray without it.
    "win10toast>=0.9 ; sys_platform == 'win32'",
    "yt-dlp>=2024.1.1",
]

[project.scripts]
my-idm = "my_idm.main:main"

[project.gui-scripts]
my-idm-gui = "my_idm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-p no:rerunfailures"
testpaths = ["tests"]
norecursedirs = [".kilo", "*worktree*", ".git", "__pycache__", ".pytest_cache"]
filterwarnings = [
    "ignore:.*pkg_resources is deprecated as an API.*:UserWarning",
]
markers = [
    "ui: constructs real Qt windows or dialogs, drives the system tray, or round-trips the real system clipboard. Applied automatically by tests/conftest.py from _INTERACTIVE_MODULES. Excluded from the basic sanity tier (pytest -m 'not ui') because it visibly interferes with the desktop, so it must not be run unattended in the background.",
]

