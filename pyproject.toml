[project]
name = "my-idm"
version = "1.0.0"
description = "A full-featured download manager with GUI — supports HTTP segmented downloads, torrents, pause/resume, and more."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.10.0",
    "aiosqlite>=0.20",
    "humanize>=4.9",
    "libtorrent>=2.0",
]

[project.scripts]
my-idm = "my_idm.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
